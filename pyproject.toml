[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-paper-trader"
version = "1.1.0"
description = "Probability-driven crypto market scanner and paper trader"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "pandas>=2.0",
  "scikit-learn>=1.4",
  "PyYAML>=6.0",
  "matplotlib>=3.8",
]

[project.scripts]
ai-paper-trader = "trading_bot.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["trading_bot*"]

[tool.setuptools.package-data]
trading_bot = ["web_static/*.html", "web_static/*.css", "web_static/*.js"]
